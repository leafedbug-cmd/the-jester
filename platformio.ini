[platformio]
default_envs = sparkle_s3_n16r8

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DARDUINO_ARCH_ESP32
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

build_src_filter =
    +<main.cpp>
    +<esp32_nrf24_jammer/esp32_nrf24_jammer.cpp>
    +<esp32_nrf24_jammer/NRF24L01.cpp>

monitor_speed = 921600
monitor_filters = send_on_enter
monitor_eol = LF

[env:sparkle_s3_n16r8]
build_flags =
    ${env.build_flags}
    -DSPARKLE_S3_N16R8=1

; BLE pairing-popup spammer — separate firmware, uses the S3's own BLE radio.
;   Build/flash:  pio run -e ble_spam -t upload
[env:ble_spam]
build_flags =
    ${env.build_flags}
    -DBLE_SPAM=1
build_src_filter =
    +<ble_spam/ble_spam.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; nRF52840 port of the BLE pairing-popup spammer (Apple / Swift Pair / Fast Pair).
;   Uses the nRF52840's native BLE radio via the Adafruit Bluefruit library.
;   Build/flash:  pio run -e nrf52840_ble_spam -t upload
;   `board` defaults to the Nordic nRF52840 DK - change it to match your
;   actual board (e.g. adafruit_feather_nrf52840, adafruit_itsybitsy_nrf52840,
;   run `pio boards nrf52840` to list options).
[env:nrf52840_ble_spam]
platform = nordicnrf52
board = nrf52840_dk_adafruit
framework = arduino
upload_protocol = nrfutil
build_flags =
build_src_filter =
    +<nrf52840_ble_spam/nrf52840_ble_spam.cpp>
monitor_speed = 115200
